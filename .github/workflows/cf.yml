name: Record Stream
run-name: ${{ github.event.inputs.run_name || 'Record Stream' }}

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: 'Name for this run e.g. BeIN Sports 1'
        required: false
      channel_url:
        description: 'Channel URL (leave empty to use stream_id secret)'
        required: false
      stream_id:
        description: 'Stream ID (1 to 20)'
        required: false
      duration:
        description: 'Duration e.g. 02:30:00'
        required: false
      folder_id:
        description: 'GoFile Folder ID (leave empty to use secret)'
        required: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

      - name: Connect WARP
        run: |
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          sleep 5
          curl https://cloudflare.com/cdn-cgi/trace | grep ip

      - name: Set stream URL and folder from secret
        run: |
          case "${{ github.event.inputs.stream_id }}" in
            "1")  BASE_URL="${{ secrets.STREAM_URL_1 }}";  echo "FOLDER_ID=${{ secrets.FOLDER_ID_1 }}"  >> $GITHUB_ENV ;;
            "2")  BASE_URL="${{ secrets.STREAM_URL_2 }}";  echo "FOLDER_ID=${{ secrets.FOLDER_ID_2 }}"  >> $GITHUB_ENV ;;
            "3")  BASE_URL="${{ secrets.STREAM_URL_3 }}";  echo "FOLDER_ID=${{ secrets.FOLDER_ID_3 }}"  >> $GITHUB_ENV ;;
            "4")  BASE_URL="${{ secrets.STREAM_URL_4 }}";  echo "FOLDER_ID=${{ secrets.FOLDER_ID_4 }}"  >> $GITHUB_ENV ;;
            "5")  BASE_URL="${{ secrets.STREAM_URL_5 }}";  echo "FOLDER_ID=${{ secrets.FOLDER_ID_5 }}"  >> $GITHUB_ENV ;;
            "6")  BASE_URL="${{ secrets.STREAM_URL_6 }}";  echo "FOLDER_ID=${{ secrets.FOLDER_ID_6 }}"  >> $GITHUB_ENV ;;
            "7")  BASE_URL="${{ secrets.STREAM_URL_7 }}";  echo "FOLDER_ID=${{ secrets.FOLDER_ID_7 }}"  >> $GITHUB_ENV ;;
            "8")  BASE_URL="${{ secrets.STREAM_URL_8 }}";  echo "FOLDER_ID=${{ secrets.FOLDER_ID_8 }}"  >> $GITHUB_ENV ;;
            "9")  BASE_URL="${{ secrets.STREAM_URL_9 }}";  echo "FOLDER_ID=${{ secrets.FOLDER_ID_9 }}"  >> $GITHUB_ENV ;;
            "10") BASE_URL="${{ secrets.STREAM_URL_10 }}"; echo "FOLDER_ID=${{ secrets.FOLDER_ID_10 }}" >> $GITHUB_ENV ;;
            "11") BASE_URL="${{ secrets.STREAM_URL_11 }}"; echo "FOLDER_ID=${{ secrets.FOLDER_ID_11 }}" >> $GITHUB_ENV ;;
            "12") BASE_URL="${{ secrets.STREAM_URL_12 }}"; echo "FOLDER_ID=${{ secrets.FOLDER_ID_12 }}" >> $GITHUB_ENV ;;
            "13") BASE_URL="${{ secrets.STREAM_URL_13 }}"; echo "FOLDER_ID=${{ secrets.FOLDER_ID_13 }}" >> $GITHUB_ENV ;;
            "14") BASE_URL="${{ secrets.STREAM_URL_14 }}"; echo "FOLDER_ID=${{ secrets.FOLDER_ID_14 }}" >> $GITHUB_ENV ;;
            "15") BASE_URL="${{ secrets.STREAM_URL_15 }}"; echo "FOLDER_ID=${{ secrets.FOLDER_ID_15 }}" >> $GITHUB_ENV ;;
            "16") BASE_URL="${{ secrets.STREAM_URL_16 }}"; echo "FOLDER_ID=${{ secrets.FOLDER_ID_16 }}" >> $GITHUB_ENV ;;
            "17") BASE_URL="${{ secrets.STREAM_URL_17 }}"; echo "FOLDER_ID=${{ secrets.FOLDER_ID_17 }}" >> $GITHUB_ENV ;;
            "18") BASE_URL="${{ secrets.STREAM_URL_18 }}"; echo "FOLDER_ID=${{ secrets.FOLDER_ID_18 }}" >> $GITHUB_ENV ;;
            "19") BASE_URL="${{ secrets.STREAM_URL_19 }}"; echo "FOLDER_ID=${{ secrets.FOLDER_ID_19 }}" >> $GITHUB_ENV ;;
            "20") BASE_URL="${{ secrets.STREAM_URL_20 }}"; echo "FOLDER_ID=${{ secrets.FOLDER_ID_20 }}" >> $GITHUB_ENV ;;
            *)    BASE_URL="${{ secrets.SCHEDULED_STREAM_URL }}"; echo "FOLDER_ID=${{ secrets.SCHEDULED_FOLDER_ID }}" >> $GITHUB_ENV ;;
          esac

          if [ -n "${{ github.event.inputs.channel_url }}" ]; then
            echo "STREAM_URL=${{ github.event.inputs.channel_url }}" >> $GITHUB_ENV
          else
            echo "STREAM_URL=$BASE_URL" >> $GITHUB_ENV
          fi

          if [ -n "${{ github.event.inputs.folder_id }}" ]; then
            echo "FOLDER_ID=${{ github.event.inputs.folder_id }}" >> $GITHUB_ENV
          fi

      - name: Record and upload live
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          DURATION: ${{ github.event.inputs.duration || secrets.SCHEDULED_DURATION }}
        run: |
          mkdir -p chunks
          DURATION_SECS=$(echo "$DURATION" | awk -F: '{ print ($1 * 3600) + ($2 * 60) + $3 }')
          START_TIME=$(date +%s)
          SESSION=0
          MIN_SIZE_BYTES=19922944  # 19MB

          REFERER=$(echo "$STREAM_URL" | python3 -c "import sys; from urllib.parse import urlparse; u=urlparse(sys.stdin.read().strip()); print(f'{u.scheme}://{u.netloc}/')")

          upload_file() {
            local FILE=$1
            local MAX_RETRIES=10
            local ATTEMPT=0
            while [ $ATTEMPT -lt $MAX_RETRIES ]; do
              ATTEMPT=$((ATTEMPT + 1))
              echo "Uploading $FILE (attempt $ATTEMPT/$MAX_RETRIES)..."
              if [ -n "$FOLDER_ID" ]; then
                RESP=$(curl -s -X POST "https://upload.gofile.io/uploadFile" \
                  -F "token=${GOFILE_TOKEN}" \
                  -F "folderId=${FOLDER_ID}" \
                  -F "file=@${FILE}")
              else
                RESP=$(curl -s -X POST "https://upload.gofile.io/uploadFile" \
                  -F "token=${GOFILE_TOKEN}" \
                  -F "file=@${FILE}")
              fi
              STATUS=$(echo $RESP | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','error'))" 2>/dev/null || echo "error")
              if [ "$STATUS" == "ok" ]; then
                echo "$FILE -> uploaded successfully"
                rm "$FILE"
                return 0
              else
                echo "$FILE -> attempt $ATTEMPT failed: $STATUS"
                if [ $ATTEMPT -lt $MAX_RETRIES ]; then
                  echo "Retrying in 30 seconds..."
                  sleep 30
                fi
              fi
            done
            echo "$FILE -> all 10 attempts failed, deleting file."
            rm "$FILE"
          }

          while true; do
            ELAPSED=$(( $(date +%s) - START_TIME ))
            REMAINING=$(( DURATION_SECS - ELAPSED ))
            if [ $REMAINING -le 0 ]; then
              echo "Total duration reached, stopping."
              break
            fi
            SESSION=$((SESSION + 1))
            CHUNK_DURATION=$(( REMAINING < 14400 ? REMAINING : 14400 ))
            echo "Session $SESSION starting - ${REMAINING}s remaining, recording ${CHUNK_DURATION}s chunk..."
            ffmpeg \
              -user_agent "Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/91.0 Mobile Safari/537.36" \
              -headers "Referer: ${REFERER}\r\n" \
              -i "$STREAM_URL" \
              -map 0 \
              -c copy \
              -t $CHUNK_DURATION \
              "chunks/session_${SESSION}.ts" || true
            FILE="chunks/session_${SESSION}.ts"
            if [ -f "$FILE" ]; then
              FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
              FILE_MB=$(( FILE_SIZE / 1024 / 1024 ))
              if [ "$FILE_SIZE" -lt "$MIN_SIZE_BYTES" ]; then
                echo "Skipping $FILE (${FILE_MB}MB) - too small, deleting..."
                rm "$FILE"
              else
                echo "Good file (${FILE_MB}MB) - uploading..."
                upload_file "$FILE" &
              fi
            fi
            echo "ffmpeg stopped, restarting in 1 second..."
            sleep 1
          done
          echo "Waiting for remaining uploads to finish..."
          wait
          echo "All uploads done."
