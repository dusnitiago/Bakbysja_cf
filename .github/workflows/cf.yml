name: Record CF

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

      - name: Connect WARP
        run: |
          warp-cli --accept-tos register
          warp-cli --accept-tos connect
          sleep 5
          curl https://cloudflare.com/cdn-cgi/trace | grep ip

      - name: Record CF
        run: |
          ffmpeg \
            -user_agent "Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/91.0 Mobile Safari/537.36" \
            -headers "Referer: http://cf.trial-onetvup.site/\r\n" \
            -i "http://cf.trial-onetvup.site//live/36857dafe9b4/1877226576/1819018.ts" \
            -c copy \
            -t 300 \
            output.ts

      - name: Upload recording
        uses: actions/upload-artifact@v4
        with:
          name: recording
          path: output.ts
